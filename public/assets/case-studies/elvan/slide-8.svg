    <text x="1280" y="24" text-anchor="end" font-size="14" font-weight="600" fill="#171717" letter-spacing="2">ELVAN</text>
    <line x1="0" y1="46" x2="1280" y2="46" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  </g>

  <!-- Main Headline & Subtitle -->
  <g transform="translate(80, 190)">
    <text x="0" y="44" font-family="'Fraunces', 'Faculty Glyphic', Georgia, serif" font-size="44" font-weight="400" fill="#171717" letter-spacing="-0.5">An Exceptional Standard of Living</text>
    <text x="0" y="86" font-size="18" font-weight="400" fill="#545454" letter-spacing="-0.2">Transforming luxury real estate discovery into a calm, elevated, and inspiring journey.</text>
  </g>

  <!-- 3 Strategic Highlight Columns -->
