<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#FCFBF9; font-family:'Geist', -apple-system, sans-serif;">
  <defs>
    <radialGradient id="mesh-8" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#A390FB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FCFBF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-8" x="-5%" y="-5%" width="110%" height="110%">
